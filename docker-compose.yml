services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-13797}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - '${BACKEND_PORT:-13797}:${BACKEND_PORT:-13797}'

  game:
    build:
      context: ./frontend/game
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:13797}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${GAME_PORT:-8080}:80'

  cover:
    build: ./frontend/cover
    restart: unless-stopped
    ports:
      - '${COVER_PORT:-8081}:80'
